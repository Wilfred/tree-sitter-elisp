name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - run: npm ci
      # src/parser.c is checked in, so it must match the current
      # grammar.js. Regenerate and check nothing changed.
      - name: Check generated parser is up to date
        run: |
          npm run generate
          git diff --exit-code src/ || {
            echo "::error::src/ is out of date. Run 'npm run generate' and commit the result."
            exit 1
          }
      - run: npm run build --if-present
      - run: npm test

      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Run tests for Rust bindings
        run: cargo t
