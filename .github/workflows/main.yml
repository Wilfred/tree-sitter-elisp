name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
      # Also generates src/parser.c, which isn't checked in. Both the
      # test run below and the Rust bindings need it.
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Run tests for Rust bindings
        run: cargo t
